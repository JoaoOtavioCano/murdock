<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>murdock - confirmation code</title>
<style>
        /* General Reset */
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            background-color: #f4f4f7;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
        }
        img {
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }
        /* Responsive tweaks */
        @media screen and (max-width: 600px) {
            .content-table {
                width: 100% !important;
            }
            .code-box {
                font-size: 32px !important;
                letter-spacing: 5px !important;
            }
        }
    </style>
</head>
<body style="background-color: #f4f4f7; padding: 20px 0;">
    <center>
        <table role="presentation" class="content-table" width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <tr>
                <td style="padding: 40px 40px 20px 40px; text-align: center;">
                    <h1 style="margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 24px; color: #333333;">Verify your email</h1>
                </td>
            </tr>
            
            <tr>
                <td style="padding: 0 40px 20px 40px; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #51545e; text-align: center;">
						<p style="margin: 0;">{{.Msg}}</p>
                </td>
            </tr>

            <tr>
                <td style="padding: 20px 40px 30px 40px; text-align: center;">
                    <div style="background-color: #f0f4f8; border-radius: 4px; padding: 20px; display: inline-block;">
                        <span class="code-box" style="font-family: 'Courier New', Courier, monospace; font-size: 42px; font-weight: bold; color: #2d3748; letter-spacing: 10px; display: block;">
                            {{.Code}}
                        </span>
                    </div>
                </td>
            </tr>

            <tr>
                <td style="padding: 0 40px 40px 40px; font-family: Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; color: #94a3b8; text-align: center;">
                    <p style="margin: 0;">If you didn't request this code, you can safely ignore this email.</p>
                </td>
            </tr>

            <tr>
                <td style="background-color: #f8fafc; padding: 30px 40px; text-align: center; border-top: 1px solid #edf2f7;">
                    <p style="margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #b0adc5;">
                        &copy; 2026 murdock <br>
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
